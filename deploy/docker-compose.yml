# agchat 部署示例
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# 注意两件事：
#   1. TRUSTED_PROXIES 必须与真实入口代理的网段一致。配太窄 → 限流按代理 IP 计，
#      所有用户共享一个桶；配太宽（如 0.0.0.0/0）→ 任何人可伪造 X-Forwarded-For。
#   2. 审计日志没有内置轮转，长期运行必须配 logrotate（见下方注释）。

services:
  agchat:
    build:
      context: ..
      dockerfile: Dockerfile
    image: agchat:local
    restart: unless-stopped
    command:
      - "-addr"
      - ":8788"
      - "-db"
      - "/data/agchat.db"
      - "-skill"
      - "/app/skill/SKILL.md"
      - "-join"
      - "/app/skill/join.md"
      - "-audit-log"
      - "/data/audit.jsonl"
      # 只有在 nginx 和自己同一个 compose 网络时才这样配；
      # 直连公网时删掉这一行（默认 = 不信任任何转发头，最安全）。
      - "-trusted-proxies"
      - "172.16.0.0/12"
    volumes:
      - agchat-data:/data
    # 不把端口暴露到公网：只让 nginx 通过内部网络访问
    expose:
      - "8788"
    healthcheck:
      test: ["CMD", "/app/agchatd", "-healthcheck", "-addr", "127.0.0.1:8788"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - agchat
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf.example:/etc/nginx/conf.d/default.conf:ro

volumes:
  agchat-data:

# --- 审计日志轮转（宿主机 cron 或 logrotate 配置）---
#
# /etc/logrotate.d/agchat:
#   /var/lib/docker/volumes/agchat_agchat-data/_data/audit.jsonl {
#       daily
#       rotate 90
#       compress
#       missingok
#       notifempty
#       copytruncate    # 服务端以 O_APPEND 打开，copytruncate 比 create 更安全
#   }
